<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - Unnati Beauty</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Unnati Beauty <span style="color: var(--primary-pink);">Parlour</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <div class="auth-container">
    <div class="card" style="max-width: 600px;">
      <h2>Book Appointment</h2>
      <div id="serviceInfo" style="margin-bottom: 2rem; padding: 1rem; background: var(--glass-bg); border-radius: 10px;">
        Select a service from services page first.
      </div>
      
      <form id="bookingForm">
        <div class="form-group">
          <label>Service</label>
          <input type="text" id="serviceName" readonly>
          <input type="hidden" name="serviceId" id="serviceId">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" name="date" required>
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" name="time" required>
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <textarea name="notes" rows="3" placeholder="Any special requirements?"></textarea>
        </div>
        <button type="submit" class="btn">Confirm Booking</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    App.checkAuth();

    // Load from localStorage
    const serviceId = localStorage.getItem('bookingServiceId');
    const serviceName = localStorage.getItem('bookingServiceName');
    if (serviceId && serviceName) {
      document.getElementById('serviceId').value = serviceId;
      document.getElementById('serviceName').value = serviceName;
      document.getElementById('serviceInfo').innerHTML = `<strong>${serviceName}</strong> selected.`;
      localStorage.removeItem('bookingServiceId');
      localStorage.removeItem('bookingServiceName');
    } else {
      document.getElementById('serviceInfo').innerHTML = 'Please <a href="services.html">select a service</a> first.';
    }

    App.handleFormSubmit('bookingForm', async (data) => {
      await App.createBooking(data);
      alert('Booking confirmed! Check dashboard.');
      location.href = 'dashboard.html';
    });
  </script>
</body>
</html>

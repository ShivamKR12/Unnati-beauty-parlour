<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Unnati Beauty</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Unnati Beauty <span style="color: var(--primary-pink);">Parlour</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="login.html" id="loginBtn" class="cta-btn">Login</a></li>
      </ul>
    </nav>
  </header>

  <section class="section">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h2>Beauty Products</h2>
      <input type="text" id="searchProducts" placeholder="Search products..." style="padding: 0.8rem; border-radius: 25px; border: 1px solid var(--glass-border); max-width: 300px;">
    </div>
    <div class="grid" id="productsList">
      <div class="card" style="grid-column: 1/-1;">
        <p>Loading products...</p>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    App.checkAuth();

    async function loadProducts(query = '') {
      try {
        const products = await App.getProducts();
        let filtered = products;
        if (query) {
          filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || p.description.toLowerCase().includes(query.toLowerCase()));
        }
        const container = document.getElementById('productsList');
        container.innerHTML = filtered.map(product => `
          <div class="product-card card">
            <img src="${product.imageUrl}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p>${product.description}</p>
            <div class="price">₹${product.price} <span style="font-size: 0.8rem; opacity: 0.7;">Stock: ${product.stock}</span></div>
            <button class="btn" onclick="addToCart('${product._id}')">Add to Cart</button>
          </div>
        `).join('') || '<p style="grid-column: 1/-1; text-align: center;">No products found</p>';
      } catch (err) {
        document.getElementById('productsList').innerHTML = `
          <div class="card" style="grid-column: 1/-1; text-align: center;">
            <p>Products load when backend running.</p>
          </div>
        `;
      }
    }

    function addToCart(productId) {
      alert('Added to cart! (Cart feature coming soon)');
    }

    document.getElementById('searchProducts')?.addEventListener('input', (e) => {
      loadProducts(e.target.value);
    });

    window.addEventListener('load', () => loadProducts());
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - Unnati Beauty</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Unnati Beauty <span style="color: var(--primary-pink);">Parlour</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <div class="auth-container">
    <div class="card login-form">
      <h2>Customer Login</h2>
      <p>Welcome back! Please login to your account.</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>

      <p style="text-align: center; margin-top: 1rem;">
        New customer? <a href="#" onclick="showModal('registerModal')">Register here</a>
      </p>
      <p style="text-align: center;">
        Admin? <a href="admin-login.html">Admin Login</a>
      </p>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="App.hideModal('registerModal')">&times;</span>
      <h3>Create Account</h3>
      <form id="registerForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Customer login
    App.handleFormSubmit('loginForm', async (data) => {
      await App.loginCustomer(data.email, data.password);
      alert('Login successful! Redirecting...');
      location.href = 'dashboard.html';
    });

    // Register
    App.handleFormSubmit('registerForm', async (data) => {
      await App.registerCustomer(data);
      alert('Registration successful! Logging in...');
      App.hideModal('registerModal');
    });

    // Auto check auth
    App.checkAuth();
  </script>
</body>
</html>

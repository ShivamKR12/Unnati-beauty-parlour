<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - Unnati Beauty</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Unnati Beauty <span style="color: var(--primary-pink);">Parlour</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><button class="cta-btn" onclick="App.logout()">Logout</button></li>
      </ul>
    </nav>
  </header>

  <section class="section">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <div>
        <h2>My Dashboard</h2>
        <p id="userInfo">Welcome back!</p>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>My Bookings</h3>
        <table class="table" id="bookingsTable">
          <thead>
            <tr>
              <th>Service</th>
              <th>Date & Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    async function loadDashboard() {
      if (!App.currentUser) {
        location.href = 'login.html';
        return;
      }

      document.getElementById('userInfo').textContent = `Welcome back, ${App.currentUser.name}!`;

      try {
        const bookings = await App.getBookings();
        const tbody = document.querySelector('#bookingsTable tbody');
        tbody.innerHTML = bookings.map(b => `
          <tr>
            <td>${b.serviceId.name}</td>
            <td>${new Date(b.date).toLocaleDateString()} ${b.time}</td>
            <td class="status-${b.status}">${b.status.toUpperCase()}</td>
            <td>
              <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;" onclick="cancelBooking('${b._id}')">Cancel</button>
            </td>
          </tr>
        `).join('') || '<tr><td colspan=4>No bookings yet</td></tr>';
      } catch (err) {
        document.querySelector('#bookingsTable tbody').innerHTML = '<tr><td colspan=4>Backend error. Check server.</td></tr>';
      }
    }

    async function cancelBooking(id) {
      if (confirm('Cancel this booking?')) {
        await App.apiCall(`/bookings/${id}`, { method: 'DELETE' });
        loadDashboard();
      }
    }

    window.addEventListener('load', loadDashboard);
  </script>
</body>
</html>

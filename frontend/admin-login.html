<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Unnati Beauty</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Unnati Beauty <span style="color: var(--primary-pink);">Parlour</span></a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="card login-form">
      <h2>Admin Login</h2>
      <p>Secure admin access only.</p>
      
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn">Admin Login</button>
      </form>

      <p style="text-align: center; margin-top: 1rem;">
        <a href="login.html">Customer Login</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    App.handleFormSubmit('adminLoginForm', async (data) => {
      await App.loginAdmin(data.email, data.password);
      alert('Admin login successful!');
      location.href = 'admin-dashboard.html';
    });
  </script>
</body>
</html>
